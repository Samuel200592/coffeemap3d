<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reporte_parcela_fecha.html</title><style>
  :root {
    --marca: #5D4037;
    --marca-claro: #EFEBE9;
    --texto: #333333;
    --suave: #666666;
    --borde: #D7CCC8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F5F5F5;
    color: var(--texto);
    font-family: Roboto, Arial, sans-serif;
    font-size: 12px;
  }
  .barra {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px;
    background: var(--marca); color: #fff;
  }
  .barra span { flex: 1 1 240px; }
  .barra button {
    border: 0; border-radius: 4px; padding: 7px 12px;
    background: #fff; color: var(--marca); font-weight: bold; cursor: pointer;
  }
  #reporte {
    width: 190mm; max-width: 100%;
    margin: 16px auto; padding: 10mm;
    background: #fff;
  }
  header.cab {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 3px solid var(--marca); padding-bottom: 6px; margin-bottom: 10px;
  }
  header.cab h1 { margin: 0; font-size: 22px; color: var(--marca); }
  header.cab p { margin: 2px 0 0; color: var(--suave); }
  header.cab .fecha { text-align: right; color: var(--suave); }
  h2 {
    font-size: 14px; color: var(--marca);
    margin: 14px 0 6px; padding-bottom: 3px;
    border-bottom: 1px solid var(--borde);
  }
  .ficha {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 16px;
  }
  .ficha div { padding: 3px 0; border-bottom: 1px dotted var(--borde); }
  .ficha b { color: var(--marca); display: inline-block; min-width: 150px; }
  table { width: 100%; border-collapse: collapse; margin: 4px 0; }
  th, td { padding: 4px 6px; border: 1px solid var(--borde); }
  th { background: var(--marca-claro); color: var(--marca); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; }
  tbody tr:nth-child(even) td { background: #FAFAFA; }
  tr.destacado td { font-weight: bold; background: #FFF8E1; }
  .nota { color: var(--suave); font-size: 11px; margin: 4px 0; }
  .texto { white-space: pre-wrap; line-height: 1.5; }
  .mapas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .mapas.tres { grid-template-columns: repeat(3, 1fr); }
  .mapa { border: 1px solid var(--borde); padding: 6px; }
  .mapa b { display: block; margin-bottom: 4px; }
  .mapa img { width: 100%; height: 150px; object-fit: contain; background: #fafafa; display: block; }
  .mapa .sin { height: 150px; display: flex; align-items: center; justify-content: center; color: var(--suave); background: #fafafa; }
  .escala { height: 8px; margin-top: 4px; }
  .rango { display: flex; justify-content: space-between; color: var(--suave); font-size: 11px; }
  footer { margin-top: 14px; padding-top: 6px; border-top: 1px solid var(--borde); color: var(--suave); font-size: 10px; }
  .bloque, .mapa, tr { page-break-inside: avoid; break-inside: avoid; }
  .salto { page-break-before: always; break-before: page; }
  body.generando { background: #fff; }
  body.generando #reporte { margin: 0; }
  #vacio { max-width: 520px; margin: 60px auto; padding: 24px; background: #fff; text-align: center; }
  @media (max-width: 600px) {
    #reporte { padding: 12px; }
    .ficha, .mapas, .mapas.tres { grid-template-columns: 1fr; }
    header.cab { flex-direction: column; align-items: flex-start; }
    header.cab .fecha { text-align: left; }
  }
  @media print {
    body { background: #fff; }
    .barra { display: none; }
    #reporte { margin: 0; width: auto; padding: 0; }
  }
</style></head><body><div id="reporte"><h2>Sin datos de reporte</h2><p>Abra este reporte desde la app CoffeeMap3D usando el enlace "Descargar reporte PDF".</p></div></body></html>
